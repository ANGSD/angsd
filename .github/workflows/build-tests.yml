name: build-tests

on:
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git SHA-1 commit hash (optional)
        required: false

jobs:
  
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-latest ]
        compiler: [ clang, gcc ]
  
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies    
      run: |
        sudo apt-get update;sudo apt-get install -y libbz2-dev liblzma-dev libcurl4-openssl-dev
        git clone --depth=1 https://github.com/ANGSD/smallBam.git
        git clone --depth=1 --recursive https://github.com/samtools/htslib
    - name: Compile dependencies (htslib)
      run: |
        cd htslib;make    
    - name: Compile main program (angsd and misc/*)
      run: |
        make HTSSRC=htslib/
    - name: Run Unit tests
      run: |
        make test BAMDIR=./smallBam/
    - name: Collect test output
      if: always()
      run: |
        mkdir -p test-output
        git ls-files --others -z -- test | xargs -0 -r cp --parents -t test-output/
    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-output-${{ matrix.os }}-${{ matrix.compiler }}
        path: test-output/
        if-no-files-found: warn
        retention-days: 30
