name: Publish wiki to Pages
on:
  gollum:              # fires when a wiki page is created or updated
  workflow_dispatch:   # manual rebuild, e.g. after deleting a page
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/wiki-to-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the wiki
        run: git clone --depth 1 https://github.com/ANGSD/angsd.wiki.git wiki
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - run: python site/build_site.py wiki build
      - run: mkdocs build -f build/mkdocs.yml -d ../_site --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
